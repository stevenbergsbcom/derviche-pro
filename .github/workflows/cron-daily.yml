name: Rappels journaliers (J-7 + J-2) + Purge logs

on:
  schedule:
    # 7h00 UTC tous les jours = 9h Paris (été) / 8h Paris (hiver)
    - cron: '0 7 * * *'
  # Permet de déclencher manuellement depuis GitHub Actions (pratique pour tester)
  workflow_dispatch:

jobs:
  trigger-daily-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le cron daily (J-7 + J-2)
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://derviche-pro.fr/api/cron/reminders/daily)

          echo "HTTP Status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ]; then
            echo "❌ Erreur HTTP $response"
            exit 1
          fi

          echo "✅ Rappels journaliers déclenchés avec succès"

      - name: Purge des logs système (> 90 jours)
        run: |
          response=$(curl -s -o /tmp/purge-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://derviche-pro.fr/api/cron/purge-logs)

          echo "HTTP Status: $response"
          echo "Response body:"
          cat /tmp/purge-response.json

          if [ "$response" != "200" ]; then
            echo "⚠️ Purge logs — erreur HTTP $response (non bloquant)"
          else
            echo "✅ Purge des logs terminée"
          fi
        # Ne pas faire échouer le workflow si la purge échoue
        continue-on-error: true

      - name: Vérification santé token Google Calendar
        run: |
          response=$(curl -s -o /tmp/gcal-health-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://derviche-pro.fr/api/cron/google-calendar-health)

          echo "HTTP Status: $response"
          echo "Response body:"
          cat /tmp/gcal-health-response.json

          if [ "$response" != "200" ]; then
            echo "⚠️ Health check Google Calendar — erreur HTTP $response (non bloquant)"
          else
            echo "✅ Vérification token Google Calendar terminée"
          fi
        # Non bloquant — ne pas faire échouer le workflow
        continue-on-error: true
