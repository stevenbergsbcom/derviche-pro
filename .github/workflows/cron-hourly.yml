name: Rappel horaire (H-4)

on:
  schedule:
    # Toutes les heures
    - cron: '0 * * * *'
  # Permet de déclencher manuellement depuis GitHub Actions (pratique pour tester)
  workflow_dispatch:

jobs:
  trigger-hourly-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le cron hourly (H-4)
        run: |
          response=$(curl -s -L -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.derviche-pro.fr/api/cron/reminders/hourly)

          echo "HTTP Status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ]; then
            echo "❌ Erreur HTTP $response"
            exit 1
          fi

          echo "✅ Rappel H-4 déclenché avec succès"
